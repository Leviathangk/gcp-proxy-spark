name: Validate Spark
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m pip install ruff==0.17.3
      - run: ruff check --select F821,F822,F823 spark tests
      - run: python -m unittest discover -v
      - run: sh -n scripts/prepare-host.sh
      - run: python -m tests.release_audit
      - run: spark fetch singbox --directory .cache/bin
      - run: spark fetch mihomo --directory .cache/bin
      - run: python -m tests.native_check --connections
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Isolated IPv4 and IPv6 counters
        run: sudo env SPARK_ISOLATED_TEST=1 unshare -n "$(command -v python)" -m tests.linux_counters
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: spark fetch singbox --directory .cache/bin
      - run: sudo apt-get update && sudo apt-get install -y nginx nftables python3-venv
      - name: Disposable host lifecycle with simulated CA
        run: sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted "$(command -v python)" -m tests.hosted_deploy
